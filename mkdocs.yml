site_name: EDE Framework
site_description: Enterprise Domain Enabler — DDD platform kernel for Python
site_url: https://the-source-core.github.io/ede-docs/
repo_url: https://github.com/the-source-core/ede-docs
repo_name: the-source-core/ede-docs
edit_uri: ""
docs_dir: docs

exclude_docs: |
    superpowers/
    connectors/
    demo-usecase/
    README.md
    # Roadmap-mirror docs — owned by the syncing-roadmap-to-docs skill.
    # They live here for repo browsing but follow a status-tracking style
    # (markers, phase tables, roadmap links) that is wrong for the public
    # developer manual. The hand-authored equivalents live in docs/features/.
    foundation-*.md
    platform-*.md

validation:
    omitted_files: warn
    absolute_links: ignore
    unrecognized_links: ignore
    nav:
        omitted_files: warn
        not_found: warn
        absolute_links: ignore
    links:
        not_found: info
        anchors: info
        absolute_links: ignore
        unrecognized_links: ignore

theme:
    name: material
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.instant
        - navigation.tracking
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.code.annotate
        - toc.follow
    palette:
        -   media: "(prefers-color-scheme: light)"
            scheme: default
            primary: indigo
            accent: indigo
            toggle:
                icon: material/brightness-7
                name: Switch to dark mode
        -   media: "(prefers-color-scheme: dark)"
            scheme: slate
            primary: indigo
            accent: indigo
            toggle:
                icon: material/brightness-4
                name: Switch to light mode
    font:
        text: Inter
        code: JetBrains Mono
    icon:
        repo: fontawesome/brands/github

markdown_extensions:
    -   admonition
    -   attr_list
    -   def_list
    -   footnotes
    -   md_in_html
    -   tables
    -   toc:
            permalink: true
    -   pymdownx.details
    -   pymdownx.inlinehilite
    -   pymdownx.snippets
    -   pymdownx.highlight:
            anchor_linenums: true
            line_spans: __span
            pygments_lang_class: true
    -   pymdownx.superfences:
            custom_fences:
                -   name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
    -   pymdownx.tabbed:
            alternate_style: true
    -   pymdownx.tasklist:
            custom_checkbox: true

plugins:
    -   search

nav:
    -   Home: index.md
    -   Tutorial:
            -   Getting Started: tutorial/00-installation.md
            -   "1. Your First Module": tutorial/01-your-first-module.md
            -   "2. Models & Fields": tutorial/02-models-and-fields.md
            -   "3. Views & the Web Client": tutorial/03-views-and-web-client.md
            -   "4. Commands & Events": tutorial/04-commands-and-events.md
            -   "5. Relationships": tutorial/05-relationships.md
            -   "6. Permissions & Security": tutorial/06-permissions.md
            -   "7. Migrations": tutorial/07-migrations.md
            -   "8. Deploying": tutorial/08-deploying.md
    -   Architecture:
            -   Overview: 01-overview.md
            -   App Structure & Loading: 02-app-structure.md
            -   Domain Model & Fields: 03-domain-model.md
            -   Command & Event Bus: 04-command-event-bus.md
            -   ORM Layer: 05-orm-layer.md
            -   Persistence: 06-persistence.md
            -   HTTP Layer: 07-http-layer.md
            -   Authentication: 08-authentication.md
            -   Tenancy: 09-tenancy.md
            -   Presentation DSL: 10-presentation-dsl.md
            -   Foundation Apps: 11-foundation-apps.md
            -   Migrations: 12-migrations.md
            -   Developer Guide: 13-dev-guide.md
            -   Lifecycle Hooks: 14-lifecycle-hooks.md
            -   Command & Event Guide: 15-command-event-guide.md
            -   Connector Framework: 16-connector-framework.md
            -   Storage Module: 17-storage-module.md
            -   Permissions: 18-permissions.md
    -   Features:
            -   Overview: features/index.md
            -   Base — Platform Substrate: features/base.md
            -   Auth — Login & Sessions: features/auth.md
            -   Approval Workflows: features/approval.md
            -   Communication (Chatter): features/communication.md
            -   Connectors: features/connectors.md
            -   Customization (Properties): features/customization.md
            -   Datasets & Metrics: features/dataset.md
            -   Email (Outbound Queue): features/email.md
            -   Multi-Tenant Gateway: features/gateway.md
            -   Internationalization: features/i18n.md
            -   Notifications: features/notifications.md
            -   Presentation (View DSL): features/presentation.md
            -   QA Automation: features/qa-automation.md
            -   Record Rules: features/record-rules.md
            -   Security & Authorization: features/security.md
            -   Document Storage: features/storage.md
            -   Workflow Engine: features/workflow.md

extra:
    social:
        -   icon: fontawesome/brands/github
            link: https://github.com/the-source-core/ede-docs

