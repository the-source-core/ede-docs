site_name: EDE Framework
site_description: Enterprise Domain Enabler — DDD platform kernel for Python
site_url: https://the-source-core.github.io/ede-docs/
repo_url: https://github.com/the-source-core/ede-docs
repo_name: the-source-core/ede-docs
edit_uri: ""
docs_dir: docs

exclude_docs: |
    superpowers/
    connectors/
    demo-usecase/
    README.md

validation:
    omitted_files: warn
    absolute_links: ignore
    unrecognized_links: ignore
    nav:
        omitted_files: warn
        not_found: warn
        absolute_links: ignore
    links:
        not_found: info
        anchors: info
        absolute_links: ignore
        unrecognized_links: ignore

theme:
    name: material
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.instant
        - navigation.tracking
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.code.annotate
        - toc.follow
    palette:
        -   media: "(prefers-color-scheme: light)"
            scheme: default
            primary: indigo
            accent: indigo
            toggle:
                icon: material/brightness-7
                name: Switch to dark mode
        -   media: "(prefers-color-scheme: dark)"
            scheme: slate
            primary: indigo
            accent: indigo
            toggle:
                icon: material/brightness-4
                name: Switch to light mode
    font:
        text: Inter
        code: JetBrains Mono
    icon:
        repo: fontawesome/brands/github

markdown_extensions:
    -   admonition
    -   attr_list
    -   def_list
    -   footnotes
    -   md_in_html
    -   tables
    -   toc:
            permalink: true
    -   pymdownx.details
    -   pymdownx.inlinehilite
    -   pymdownx.snippets
    -   pymdownx.highlight:
            anchor_linenums: true
            line_spans: __span
            pygments_lang_class: true
    -   pymdownx.superfences:
            custom_fences:
                -   name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
    -   pymdownx.tabbed:
            alternate_style: true
    -   pymdownx.tasklist:
            custom_checkbox: true

plugins:
    -   search

nav:
